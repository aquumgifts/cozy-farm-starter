<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Cozy Farm Starter</title>
<!--
  Cozy Farm Starter: a tiny top-down farming game and an open source template (MIT, see LICENSE-code.txt).
  Till, plant, water, harvest, ship. One HTML file for the engine, config.js for the map, crops and texts.
  Art: Cozy Farm Lite (free) · Sounds: Cozy Farm SFX (free) · Font: Cozy Space Pixel Font (free), all by Bramble & Byte.
  Screenshot modes for the store page: #captura-a | #captura-b | #captura-c | #captura-d (no HUD)
-->
<style>
  html, body { margin: 0; height: 100%; background: #26381f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="config.js"></script>
<script>
"use strict";
const CFG = window.FARM;
const W = 320, H = 180, T = 16;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let S = 3;
function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  S = k >= 1 ? Math.floor(k) : k;
  cv.width = Math.round(W * S); cv.height = Math.round(H * S); ctx.imageSmoothingEnabled = false;
}
addEventListener("resize", fit); fit();

// ---------- map ----------
const MAP = CFG.map;
const MW = MAP[0].length, MH = MAP.length;
MAP.forEach((row, y) => { if (row.length !== MW) throw new Error(`config.js: map row ${y} has ${row.length} tiles, expected ${MW}`); });
const at = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH ? " " : MAP[y][x]);
const isField = (x, y) => at(x, y) === "#" || at(x, y) === "s";
const isFence = (x, y) => at(x, y) === "f" || at(x, y) === "g";
const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;

// ---------- images ----------
const CROP_IDS = Object.keys(CFG.crops);
const PIECES = ["nw", "n", "ne", "w", "c", "e", "sw", "s", "se", "inner-nw", "inner-ne", "inner-sw", "inner-se"];
const IMG = {};
const files = [
  "tiles/tile-grass-1", "tiles/tile-grass-2", "tiles/tile-grass-3",
  ...["soil", "soil-wet", "path"].flatMap(k => PIECES.map(p => `tiles/tile-${k}-${p}`)),
  ...["cross", "end-e", "end-n", "end-s", "end-w", "h", "ne", "nw", "post", "se", "sw", "v"].map(p => `fences/fence-${p}`),
  "fences/gate-closed", "fences/gate-open",
  ...["barrel", "bush", "crate", "flowers", "hay-bale", "rock"].map(p => `props/${p}`),
  "trees/oak", "characters/farmer", "animals/chicken-white",
  "items/hoe", "items/watering-can", "items/seed-bag",
  ...CROP_IDS.flatMap(id => [CFG.crops[id].strip, CFG.crops[id].icon]),
];
function loadImages() {
  return Promise.all([...new Set(files)].map(f => new Promise((ok, fail) => {
    const i = new Image();
    i.onload = () => { IMG[f] = i; ok(); };
    i.onerror = () => fail(new Error("missing assets/" + f + ".png"));
    i.src = `assets/${f}.png`;
  })));
}

// ---------- font ----------
for (const [file, weight] of [["CozySpacePixel-Regular", 400], ["CozySpacePixel-Bold", 700]]) {
  try { const f = new FontFace("CSP", `url(assets/fonts/${file}.woff)`, { weight }); document.fonts.add(f); f.load().catch(() => {}); } catch (e) {}
}
function text(str, x, y, { color = "#f6f0e2", bold = false, align = "left", shadow = "#3e2a28" } = {}) {
  ctx.font = `${bold ? 700 : 400} 10px CSP, "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = "top";
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, Math.round(x), Math.round(y) + 1); }
  ctx.fillStyle = color; ctx.fillText(str, Math.round(x), Math.round(y));
}
const textWidth = (str, bold = false) => { ctx.font = `${bold ? 700 : 400} 10px CSP, "Courier New", monospace`; return Math.ceil(ctx.measureText(str).width); };

// ---------- sound ----------
const SFX = {};
for (const n of ["hoe-dig", "watering", "seed-plant", "harvest-pop", "sell-coins", "jingle-new-day", "ui-click", "ui-back", "not-enough-money", "shop-bell", "step-grass", "gate", "jingle-level-up", "buy"]) {
  const a = new Audio(`assets/sfx/${n}.wav`); a.preload = "auto"; SFX[n] = a;
}
const ambience = new Audio("assets/sfx/ambience-morning-birds.ogg"); ambience.loop = true; ambience.volume = 0.35;
let muted = false, audioOn = false;
function play(n, vol = 0.8) {
  if (muted || !audioOn || !SFX[n]) return;
  const a = SFX[n].cloneNode(); a.volume = vol; a.play().catch(() => {});
}
function startAudio() {
  if (audioOn) return; audioOn = true;
  if (!muted) ambience.play().catch(() => {});
}

// ---------- state ----------
const SAVE_KEY = "cozy-farm-starter";
let st;
function newFarm() {
  const fieldTiles = {};
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (at(x, y) === "s") fieldTiles[`${x},${y}`] = { tilled: true, wet: false, crop: null, stage: 0, growth: 0 };
  let px = 0, py = 0;
  MAP.forEach((r, y) => { const x = r.indexOf("@"); if (x >= 0) { px = x * T + 8; py = y * T + 12; } });
  const seeds = {}, bag = {}, shipped = {};
  CROP_IDS.forEach((id, i) => { seeds[id] = i === 0 ? 6 : 0; bag[id] = 0; shipped[id] = 0; });
  return { day: 1, coins: CFG.startCoins, seeds, bag, shipped, fields: fieldTiles, px, py, goalShown: false };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.fields && s.day) return s; } catch (e) {}
  return null;
}
const cell = (x, y) => st.fields[`${x},${y}`];
const tilled = (x, y) => !!(cell(x, y) && cell(x, y).tilled);

// ---------- solids ----------
function solidTile(x, y, forChicken = false) {
  const c = at(x, y);
  if (c === " ") return true;
  if (c === "g") return forChicken;
  if (forChicken && isField(x, y)) return true;
  return "frbhSBT".includes(c);
}
function blocked(px, py, forChicken = false) { // feet box 10 x 6
  const x0 = Math.floor((px - 5) / T), x1 = Math.floor((px + 4) / T), y0 = Math.floor((py - 5) / T), y1 = Math.floor(py / T);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (solidTile(x, y, forChicken)) return true;
  return false;
}

// ---------- player & chickens ----------
const DIRS = { down: [0, 1, 0], left: [-1, 0, 1], right: [1, 0, 2], up: [0, -1, 3] };
const pl = { dir: "down", moving: false, anim: 0, step: 0 };
let chickens = [];
function spawnChickens() {
  chickens = [];
  MAP.forEach((r, y) => [...r].forEach((c, x) => { if (c === "c") chickens.push({ x: x * T + 8, y: y * T + 12, dir: "down", tx: null, ty: null, wait: Math.random() * 2, peck: 0, anim: 0, heart: 0 }); }));
}
function updateChicken(c, dt) {
  c.heart = Math.max(0, c.heart - dt);
  if (c.peck > 0) { c.peck -= dt; c.anim += dt; return; }
  if (c.wait > 0) { c.wait -= dt; return; }
  if (c.tx === null) {
    const a = Math.random() * Math.PI * 2, d = 16 + Math.random() * 40;
    c.tx = c.x + Math.cos(a) * d; c.ty = c.y + Math.sin(a) * d;
  }
  const dx = c.tx - c.x, dy = c.ty - c.y, dist = Math.hypot(dx, dy);
  if (dist < 1) { c.tx = null; if (Math.random() < 0.5) c.peck = 1.2; else c.wait = 0.5 + Math.random() * 2; return; }
  const sp = 18 * dt, nx = c.x + (dx / dist) * sp, ny = c.y + (dy / dist) * sp;
  if (blocked(nx, ny, true) || Math.hypot(nx - st.px, ny - st.py) < 10) { c.tx = null; c.wait = 0.4; return; }
  c.x = nx; c.y = ny; c.anim += dt;
  c.dir = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
}

// ---------- hotbar ----------
const SLOTS = [{ kind: "hoe", icon: "items/hoe", name: "Hoe" }, { kind: "can", icon: "items/watering-can", name: "Watering can" },
  ...CROP_IDS.map(id => ({ kind: "seed", crop: id, icon: CFG.crops[id].icon, name: CFG.crops[id].name + " seeds" }))];
let slot = 0;

// ---------- messages, effects ----------
let toast = { msg: "", t: 0 };
function say(msg, secs = 3) { toast = { msg, t: secs }; }
const pops = []; // floating icons / numbers
function pop(x, y, icon, label) { pops.push({ x, y, icon, label, t: 1 }); }

// ---------- target tile ----------
function target() {
  const [dx, dy] = DIRS[pl.dir];
  return { x: Math.floor(st.px / T) + dx, y: Math.floor((st.py - 2) / T) + dy }; // the tile next to the one under your feet
}

// ---------- actions ----------
let mode = "title"; // title | play | shop | night
let clean = false; // screenshot without HUD (store cover)
let shopSel = 0, night = null;
function use() {
  const { x, y } = target();
  const c = at(x, y);
  if (c === "S") return endDay();
  if (c === "B") { mode = "shop"; shopSel = Math.max(0, SLOTS[slot].kind === "seed" ? CROP_IDS.indexOf(SLOTS[slot].crop) : 0); play("shop-bell", 0.6); return; }
  const ch = chickens.find(k => Math.abs(k.x - (x * T + 8)) < 12 && Math.abs(k.y - (y * T + 10)) < 12);
  if (ch) { ch.heart = 1.2; ch.peck = 0.6; play("ui-click", 0.5); return; }
  if (!isField(x, y)) return;
  let f = cell(x, y);
  if (f && f.crop && f.stage === 3) { // harvest with any tool
    st.bag[f.crop]++; pop(x * T + 8, y * T, CFG.crops[f.crop].icon, "+1");
    f.crop = null; f.stage = 0; f.growth = 0; play("harvest-pop"); save(); return;
  }
  const s = SLOTS[slot];
  if (s.kind === "hoe") {
    if (!f) f = st.fields[`${x},${y}`] = { tilled: false, wet: false, crop: null, stage: 0, growth: 0 };
    if (!f.tilled) { f.tilled = true; play("hoe-dig"); save(); }
  } else if (s.kind === "can") {
    if (f && f.tilled) { if (!f.wet) { f.wet = true; play("watering", 0.7); save(); } }
    else say("Till the ground with the hoe first.");
  } else if (s.kind === "seed") {
    if (!f || !f.tilled) return say("Till the ground with the hoe first.");
    if (f.crop) return say(CFG.texts.needWater);
    if (st.seeds[s.crop] <= 0) return say(CFG.texts.noSeeds);
    st.seeds[s.crop]--; f.crop = s.crop; f.stage = 0; f.growth = 0; play("seed-plant"); save();
  }
}
function buy(i) {
  const id = CROP_IDS[i], price = CFG.crops[id].seedPrice;
  if (st.coins < price) { play("not-enough-money", 0.7); return say(CFG.texts.noMoney); }
  st.coins -= price; st.seeds[id]++; play("buy", 0.7); save();
}
function endDay() {
  let earned = 0; const sold = [];
  for (const id of CROP_IDS) if (st.bag[id] > 0) { earned += st.bag[id] * CFG.crops[id].sellPrice; sold.push([id, st.bag[id]]); st.bag[id] = 0; }
  st.coins += earned;
  for (const f of Object.values(st.fields)) {
    if (f.crop && f.wet && f.stage < 3) { f.growth++; if (f.growth >= CFG.crops[f.crop].daysPerStage) { f.stage++; f.growth = 0; } }
    f.wet = false;
  }
  st.day++;
  const goal = !st.goalShown && st.coins >= CFG.goalCoins;
  if (goal) st.goalShown = true;
  night = { t: 0, earned, sold, goal };
  mode = "night"; play(earned > 0 ? "sell-coins" : "ui-click");
  save();
}

// ---------- input ----------
const keys = new Set();
const touch = matchMedia("(pointer: coarse)").matches;
const pad = { up: false, down: false, left: false, right: false };
addEventListener("keydown", e => {
  startAudio();
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
  if (e.repeat) return;
  keys.add(k);
  if (k === "m") { muted = !muted; if (muted) ambience.pause(); else ambience.play().catch(() => {}); }
  press(k);
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
function press(k) {
  const act = k === " " || k === "z" || k === "enter" || k === "e";
  const back = k === "x" || k === "escape" || k === "q";
  if (mode === "title") { if (act) { mode = "play"; say(CFG.texts.hello, 4); play("ui-click"); } else if (k === "n") { st = newFarm(); save(); spawnChickens(); mode = "play"; say(CFG.texts.hello, 4); } return; }
  if (mode === "night") { if (act && night.t > 0.8) { mode = "play"; play("jingle-new-day", 0.6); if (night.goal) say(CFG.texts.goal, 5); } return; }
  if (mode === "shop") {
    if (k === "arrowup" || k === "w") shopSel = (shopSel + CROP_IDS.length - 1) % CROP_IDS.length;
    else if (k === "arrowdown" || k === "s") shopSel = (shopSel + 1) % CROP_IDS.length;
    else if (act) buy(shopSel);
    else if (back) { mode = "play"; play("ui-back", 0.6); }
    return;
  }
  if (act) use();
  else if (k === "tab" || k === "c") { slot = (slot + 1) % SLOTS.length; play("ui-click", 0.4); }
  else if (/^[1-9]$/.test(k) && +k <= SLOTS.length) { slot = +k - 1; play("ui-click", 0.4); }
}
addEventListener("wheel", e => { if (mode === "play") slot = (slot + (e.deltaY > 0 ? 1 : SLOTS.length - 1)) % SLOTS.length; });

// touch / mouse: hotbar, shop rows, on-screen pad
const PAD = { x: 8, y: H - 56, s: 16 };
const BTN_A = { x: W - 30, y: H - 40, r: 12 }, BTN_B = { x: W - 58, y: H - 26, r: 10 };
const pointers = new Map();
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function hotbarRect(i) { const n = SLOTS.length, x0 = Math.round(W / 2 - (n * 22) / 2); return { x: x0 + i * 22, y: H - 24, w: 20, h: 20 }; }
const inside = (p, r) => p.x >= r.x && p.y >= r.y && p.x < r.x + r.w && p.y < r.y + r.h;
function padDir(p) {
  const cx = PAD.x + PAD.s * 1.5, cy = PAD.y + PAD.s * 1.5, dx = p.x - cx, dy = p.y - cy;
  if (Math.hypot(dx, dy) > PAD.s * 2.4 || Math.hypot(dx, dy) < 4) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
}
function refreshPad() {
  pad.up = pad.down = pad.left = pad.right = false;
  for (const p of pointers.values()) { const d = padDir(p); if (d) pad[d] = true; }
}
cv.addEventListener("pointerdown", e => {
  startAudio(); e.preventDefault();
  const p = toGame(e);
  if (mode === "title") { if (inside(p, fullBtn)) return open(CFG.fullPackUrl); return press(" "); }
  if (mode === "night") { if (night.goal && inside(p, fullBtn)) return open(CFG.fullPackUrl); return press(" "); }
  if (mode === "shop") {
    for (let i = 0; i < CROP_IDS.length; i++) if (inside(p, shopRow(i))) { shopSel = i; return buy(i); }
    if (!inside(p, SHOP)) { mode = "play"; play("ui-back", 0.6); }
    return;
  }
  for (let i = 0; i < SLOTS.length; i++) if (inside(p, hotbarRect(i))) { slot = i; play("ui-click", 0.4); return; }
  if (touch && Math.hypot(p.x - BTN_A.x, p.y - BTN_A.y) < BTN_A.r + 4) return use();
  if (touch && Math.hypot(p.x - BTN_B.x, p.y - BTN_B.y) < BTN_B.r + 4) { slot = (slot + 1) % SLOTS.length; return play("ui-click", 0.4); }
  if (touch) { pointers.set(e.pointerId, p); refreshPad(); return; }
  // mouse: click the tile in front of you
  use();
});
cv.addEventListener("pointermove", e => { if (pointers.has(e.pointerId)) { pointers.set(e.pointerId, toGame(e)); refreshPad(); } });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) cv.addEventListener(ev, e => { pointers.delete(e.pointerId); refreshPad(); });
function open(url) { window.open(url, "_blank", "noopener"); }

// ---------- update ----------
let stepT = 0;
function update(dt) {
  if (toast.t > 0) toast.t -= dt;
  for (const p of pops) p.t -= dt;
  while (pops.length && pops[0].t <= 0) pops.shift();
  chickens.forEach(c => updateChicken(c, dt));
  if (mode === "night") { night.t += dt; return; }
  if (mode !== "play") return;
  let dx = 0, dy = 0;
  if (keys.has("arrowleft") || keys.has("a") || pad.left) dx--;
  if (keys.has("arrowright") || keys.has("d") || pad.right) dx++;
  if (keys.has("arrowup") || keys.has("w") || pad.up) dy--;
  if (keys.has("arrowdown") || keys.has("s") || pad.down) dy++;
  pl.moving = dx !== 0 || dy !== 0;
  if (pl.moving) {
    pl.dir = dx !== 0 && (dy === 0 || pl.dir === "left" || pl.dir === "right") ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
    const sp = 64 * dt / (dx && dy ? Math.SQRT2 : 1);
    if (!blocked(st.px + dx * sp, st.py)) st.px += dx * sp;
    if (!blocked(st.px, st.py + dy * sp)) st.py += dy * sp;
    pl.anim += dt;
    stepT -= dt; if (stepT <= 0) { play("step-grass", 0.18); stepT = 0.32; }
  } else pl.anim = 0;
}

// ---------- drawing ----------
const cam = { x: 0, y: 0 };
function autotile(prefix, x, y, has) {
  const ox = x * T - cam.x, oy = y * T - cam.y;
  for (const [qx, qy, vy, hx, corner] of [[0, 0, -1, -1, "nw"], [8, 0, -1, 1, "ne"], [0, 8, 1, -1, "sw"], [8, 8, 1, 1, "se"]]) {
    const v = has(x, y + vy), h = has(x + hx, y), d = has(x + hx, y + vy);
    let piece;
    if (!v && !h) piece = corner;
    else if (!v) piece = vy < 0 ? "n" : "s";
    else if (!h) piece = hx < 0 ? "w" : "e";
    else if (!d) piece = "inner-" + corner;
    else piece = "c";
    ctx.drawImage(IMG[`tiles/tile-${prefix}-${piece}`], qx, qy, 8, 8, ox + qx, oy + qy, 8, 8);
  }
}
function fencePiece(x, y) {
  const n = isFence(x, y - 1), s = isFence(x, y + 1), e = isFence(x + 1, y), w = isFence(x - 1, y);
  const k = (n ? 1 : 0) + (s ? 2 : 0) + (e ? 4 : 0) + (w ? 8 : 0);
  return { 12: "h", 3: "v", 6: "nw", 10: "ne", 5: "sw", 9: "se", 4: "end-w", 8: "end-e", 2: "end-n", 1: "end-s", 0: "post" }[k] || "cross";
}
const nearGate = (x, y) => Math.hypot(st.px - (x * T + 8), st.py - (y * T + 8)) < 26;

function drawWorld() {
  cam.x = Math.round(Math.max(0, Math.min(MW * T - W, st.px - W / 2)));
  cam.y = Math.round(Math.max(0, Math.min(MH * T - H, st.py - H / 2)));
  const x0 = Math.floor(cam.x / T), y0 = Math.floor(cam.y / T), x1 = Math.min(MW - 1, x0 + Math.ceil(W / T)), y1 = Math.min(MH - 1, y0 + Math.ceil(H / T));
  // ground
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const c = at(x, y), hsh = hash(x, y);
    const g = c === "," ? "tiles/tile-grass-3" : (hsh % 7 === 0 ? "tiles/tile-grass-2" : "tiles/tile-grass-1");
    ctx.drawImage(IMG[g], x * T - cam.x, y * T - cam.y);
    if (c === "p") autotile("path", x, y, (a, b) => at(a, b) === "p");
    else if (tilled(x, y)) autotile(cell(x, y).wet ? "soil-wet" : "soil", x, y, tilled);
  }
  // crops
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const f = cell(x, y);
    if (f && f.crop) ctx.drawImage(IMG[CFG.crops[f.crop].strip], f.stage * T, 0, T, T, x * T - cam.x, y * T - cam.y, T, T);
  }
  // target cursor
  if (mode === "play") {
    const t = target(), tx = t.x * T - cam.x, ty = t.y * T - cam.y, c = at(t.x, t.y);
    if (isField(t.x, t.y) || "SB".includes(c)) {
      ctx.fillStyle = "rgba(246,240,226,0.9)";
      for (const [a, b, w, h] of [[0, 0, 4, 1], [0, 0, 1, 4], [12, 0, 4, 1], [15, 0, 1, 4], [0, 15, 4, 1], [0, 12, 1, 4], [12, 15, 4, 1], [15, 12, 1, 4]]) ctx.fillRect(tx + a, ty + b, w, h);
    }
  }
  // sorted objects
  const objs = [];
  for (let y = Math.max(0, y0 - 1); y <= Math.min(MH - 1, y1 + 3); y++) for (let x = Math.max(0, x0 - 1); x <= Math.min(MW - 1, x1 + 1); x++) {
    const c = at(x, y), sx = x * T - cam.x, sy = y * T - cam.y;
    if (c === "f") objs.push([sy + T, () => ctx.drawImage(IMG[`fences/fence-${fencePiece(x, y)}`], sx, sy)]);
    else if (c === "g") objs.push([sy + T, () => ctx.drawImage(IMG[nearGate(x, y) ? "fences/gate-open" : "fences/gate-closed"], sx, sy)]);
    else if (c === "T") objs.push([sy + T, () => ctx.drawImage(IMG["trees/oak"], sx - 8, sy - 32)]);
    else { const p = { r: "rock", b: "bush", w: "flowers", h: "hay-bale", S: "crate", B: "barrel" }[c]; if (p) objs.push([sy + T - (c === "w" ? 8 : 0), () => ctx.drawImage(IMG[`props/${p}`], sx, sy)]); }
  }
  for (const c of chickens) objs.push([c.y, () => {
    let col, row;
    if (c.peck > 0) { row = 4; col = (c.dir === "left" ? 0 : 1); if (Math.floor(c.anim * 6) % 2) row = DIRS[c.dir][2], col = 1; }
    else { row = DIRS[c.dir][2]; col = c.tx !== null ? [0, 1, 2, 1][Math.floor(c.anim * 8) % 4] : 1; }
    const sx = Math.round(c.x - 8 - cam.x), sy = Math.round(c.y - 14 - cam.y);
    ctx.drawImage(IMG["animals/chicken-white"], col * T, row * T, T, T, sx, sy, T, T);
    if (c.heart > 0) drawHeart(sx + 5, sy - 6 - Math.round((1.2 - c.heart) * 6));
  }]);
  objs.push([st.py, () => {
    const col = pl.moving ? [0, 1, 2, 1][Math.floor(pl.anim * 8) % 4] : 1;
    ctx.drawImage(IMG["characters/farmer"], col * T, DIRS[pl.dir][2] * T, T, T, Math.round(st.px - 8 - cam.x), Math.round(st.py - 15 - cam.y), T, T);
  }]);
  objs.sort((a, b) => a[0] - b[0]).forEach(o => o[1]());
  // pops
  for (const p of pops) {
    const k = 1 - p.t, x = Math.round(p.x - cam.x - 8), y = Math.round(p.y - cam.y - 10 - k * 12);
    ctx.globalAlpha = Math.min(1, p.t * 2);
    ctx.drawImage(IMG[p.icon], x, y); text(p.label, x + 17, y + 3, { bold: true });
    ctx.globalAlpha = 1;
  }
}
function drawHeart(x, y) {
  ctx.fillStyle = "#3e2a28"; ctx.fillRect(x, y, 7, 6);
  ctx.fillStyle = "#d64840";
  for (const [a, b, w] of [[1, 1, 2], [4, 1, 2], [1, 2, 5], [2, 3, 3], [3, 4, 1]]) ctx.fillRect(x + a, y + b, w, 1);
  ctx.clearRect(x, y, 1, 1); ctx.clearRect(x + 6, y, 1, 1); ctx.clearRect(x + 3, y, 1, 1);
}
function coin(x, y) {
  ctx.fillStyle = "#3e2a28"; ctx.fillRect(x + 1, y, 6, 8); ctx.fillRect(x, y + 1, 8, 6);
  ctx.fillStyle = "#f0ce70"; ctx.fillRect(x + 1, y + 1, 6, 6);
  ctx.fillStyle = "#d6aa50"; ctx.fillRect(x + 3, y + 2, 2, 4);
}
function panel(x, y, w, h, fill = "#3e2a28", edge = "#f0ce70") {
  ctx.fillStyle = edge; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  ctx.fillStyle = fill; ctx.fillRect(x + 2, y + 1, w - 4, h - 2); ctx.fillRect(x + 1, y + 2, w - 2, h - 4);
}
function drawHud() {
  // day and coins
  panel(4, 4, 44, 15); text(`Day ${st.day}`, 10, 7);
  const cs = String(st.coins), cw = textWidth(cs) + 22;
  panel(W - cw - 4, 4, cw, 15); coin(W - cw + 2, 8); text(cs, W - cw + 14, 7, { color: "#f0ce70" });
  // harvest bag
  let bx = W - cw - 8;
  for (const id of [...CROP_IDS].reverse()) if (st.bag[id] > 0) {
    const label = String(st.bag[id]), w = textWidth(label) + 22; bx -= w;
    panel(bx, 4, w, 15); ctx.drawImage(IMG[CFG.crops[id].icon], bx + 2, 3); text(label, bx + 18, 7);
    bx -= 3;
  }
  // hotbar
  SLOTS.forEach((s, i) => {
    const r = hotbarRect(i);
    panel(r.x, r.y, r.w, r.h, i === slot ? "#6b4a2e" : "#3e2a28", i === slot ? "#f0ce70" : "#92603c");
    if (s.kind === "seed") {
      ctx.drawImage(IMG["items/seed-bag"], r.x + 2, r.y + 2);
      ctx.drawImage(IMG[s.icon], 0, 0, T, T, r.x + 11, r.y + 1, 8, 8);
      text(String(st.seeds[s.crop]), r.x + r.w - 2, r.y + 11, { align: "right", color: st.seeds[s.crop] ? "#f6f0e2" : "#c86478" });
    } else ctx.drawImage(IMG[s.icon], r.x + 2, r.y + 2);
  });
  if (mode === "play" && !touch) { const s = SLOTS[slot]; text(s.name, W / 2, H - 36, { align: "center" }); }
  // toast
  if (toast.t > 0 && toast.msg) {
    const w = Math.min(W - 16, textWidth(toast.msg) + 16), x = Math.round(W / 2 - w / 2);
    ctx.globalAlpha = Math.min(1, toast.t * 3);
    panel(x, 24, w, 16); text(toast.msg, W / 2, 28, { align: "center" });
    ctx.globalAlpha = 1;
  }
  // touch controls
  if (touch && mode === "play") {
    ctx.globalAlpha = 0.55;
    for (const [d, gx, gy] of [["up", 1, 0], ["left", 0, 1], ["right", 2, 1], ["down", 1, 2]]) {
      panel(PAD.x + gx * PAD.s, PAD.y + gy * PAD.s, PAD.s, PAD.s, pad[d] ? "#6b4a2e" : "#3e2a28", "#f6f0e2");
    }
    circle(BTN_A.x, BTN_A.y, BTN_A.r); text("A", BTN_A.x, BTN_A.y - 5, { align: "center", bold: true });
    circle(BTN_B.x, BTN_B.y, BTN_B.r); text("B", BTN_B.x, BTN_B.y - 5, { align: "center", bold: true });
    ctx.globalAlpha = 1;
  }
}
function circle(x, y, r) { ctx.fillStyle = "#f6f0e2"; ctx.beginPath(); ctx.arc(x, y, r + 1, 0, 7); ctx.fill(); ctx.fillStyle = "#3e2a28"; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
const SHOP = { x: W / 2 - 80, y: 34, w: 160, h: 26 + 18 * 3 + 16 };
const shopRow = i => ({ x: SHOP.x + 6, y: SHOP.y + 22 + i * 18, w: SHOP.w - 12, h: 16 });
function drawShop() {
  SHOP.h = 26 + 18 * CROP_IDS.length + 16;
  panel(SHOP.x, SHOP.y, SHOP.w, SHOP.h);
  text("Seed barrel", SHOP.x + SHOP.w / 2, SHOP.y + 7, { align: "center", bold: true, color: "#f0ce70" });
  CROP_IDS.forEach((id, i) => {
    const r = shopRow(i), cr = CFG.crops[id];
    if (i === shopSel) { ctx.fillStyle = "#6b4a2e"; ctx.fillRect(r.x, r.y, r.w, r.h); }
    ctx.drawImage(IMG[cr.icon], r.x + 2, r.y);
    text(`${cr.name} (${st.seeds[id]})`, r.x + 22, r.y + 3);
    coin(r.x + r.w - 26, r.y + 4); text(String(cr.seedPrice), r.x + r.w - 15, r.y + 3, { color: "#f0ce70" });
  });
  text(touch ? "tap to buy · tap outside to close" : "Space: buy · X: close", SHOP.x + SHOP.w / 2, SHOP.y + SHOP.h - 13, { align: "center", color: "#cfe3b8" });
}
const fullBtn = { x: 0, y: 128, w: 0, h: 18 };
function drawFullButton(label) {
  fullBtn.w = textWidth(label, true) + 20; fullBtn.x = Math.round(W / 2 - fullBtn.w / 2);
  panel(fullBtn.x, fullBtn.y, fullBtn.w, fullBtn.h, "#6b4a2e");
  text(label, W / 2, fullBtn.y + 4, { align: "center", color: "#f0ce70", bold: true });
}
function drawNight() {
  const a = Math.min(0.82, night.t * 1.5);
  ctx.fillStyle = `rgba(20,24,40,${a})`; ctx.fillRect(0, 0, W, H);
  if (night.t < 0.5) return;
  text(`Day ${st.day}`, W / 2, 34, { align: "center", bold: true, color: "#f0ce70" });
  if (night.sold.length) {
    text("You shipped:", W / 2, 54, { align: "center" });
    const parts = night.sold.map(([id, n]) => ({ id, n, w: 16 + textWidth(`x${n}`) + 8 }));
    let x = Math.round(W / 2 - parts.reduce((s, p) => s + p.w, 0) / 2);
    for (const p of parts) { ctx.drawImage(IMG[CFG.crops[p.id].icon], x, 66); text(`x${p.n}`, x + 17, 70); x += p.w; }
    coin(W / 2 - 24, 92); text(`+${night.earned}`, W / 2 - 12, 91, { color: "#f0ce70" });
  } else text("A quiet night on the farm.", W / 2, 66, { align: "center" });
  text("Watered crops grew overnight.", W / 2, 108, { align: "center", color: "#cfe3b8" });
  if (night.goal) drawFullButton("Get the full Cozy Farm ↗");
  if (night.t > 0.8) text(touch ? "tap to wake up" : "press Space", W / 2, 156, { align: "center", color: "#cfe3b8" });
}
function drawTitle() {
  ctx.fillStyle = "rgba(38,56,31,0.55)"; ctx.fillRect(0, 0, W, H);
  panel(40, 26, W - 80, 92);
  ctx.font = `700 20px CSP, "Courier New", monospace`; ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = "#3e2a28"; ctx.fillText(CFG.title, W / 2, 36); ctx.fillStyle = "#f6f0e2"; ctx.fillText(CFG.title, W / 2, 34);
  text("till · plant · water · harvest · ship", W / 2, 62, { align: "center", color: "#f0ce70" });
  text(touch ? "pad: walk · A: use · B: next tool" : "arrows/WASD: walk · Space: use · 1-5: tools", W / 2, 80, { align: "center" });
  text(touch ? "tap to start" : (st.day > 1 ? "Space: continue · N: new farm" : "press Space to start"), W / 2, 98, { align: "center", color: "#cfe3b8" });
  drawFullButton("Full Cozy Farm: 10 crops, animals ↗");
  text("free assets: Cozy Farm Lite by Bramble & Byte", W / 2, 154, { align: "center", color: "#cfe3b8" });
}
function frame() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  drawWorld();
  if ((mode === "play" || mode === "shop") && !clean) drawHud();
  if (mode === "shop") drawShop();
  if (mode === "night") drawNight();
  if (mode === "title") drawTitle();
}

// ---------- screenshots for the store page ----------
function demoState(kind) {
  st = newFarm(); st.day = 6; st.coins = 64; st.seeds = { carrot: 4, wheat: 7, tomato: 2 }; st.bag = { carrot: 3, wheat: 0, tomato: 2 };
  const plant = (x, y, crop, stage, wet) => { st.fields[`${x},${y}`] = { tilled: true, wet, crop, stage, growth: 0 }; };
  for (let x = 8; x <= 21; x++) for (let y = 3; y <= 7; y++) {
    const col = x - 8;
    if (y === 7 && x > 18) continue;
    if (x <= 10) plant(x, y, "carrot", y === 3 ? 3 : 2, y > 4);
    else if (x <= 14) plant(x, y, "wheat", Math.min(3, (x + y) % 4), y % 2 === 0);
    else if (x <= 18) plant(x, y, "tomato", y < 6 ? 3 : 1, true);
    else if (y < 6) plant(x, y, null, 0, col % 2 === 0);
  }
  if (kind === "a") { st.px = 14 * T + 8; st.py = 9 * T + 6; pl.dir = "up"; mode = "play"; say("Till, plant, water, harvest. Ship it in the crate!", 99); }
  if (kind === "d") { st.px = 14 * T + 8; st.py = 9 * T + 6; pl.dir = "up"; mode = "play"; clean = true; }
  if (kind === "b") { st.px = 11 * T + 8; st.py = 11 * T + 12; pl.dir = "up"; slot = 2; mode = "shop"; shopSel = 1; }
  if (kind === "c") { st.px = 9 * T + 8; st.py = 11 * T + 12; pl.dir = "up"; st.coins = 112; st.bag = { carrot: 0, wheat: 0, tomato: 0 }; night = { t: 2, earned: 48, sold: [["carrot", 3], ["tomato", 2]], goal: true }; st.day = 7; mode = "night"; }
}

// ---------- start ----------
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t;
  update(dt); frame();
  requestAnimationFrame(loop);
}
(async () => {
  await loadImages();
  try { await Promise.all([document.fonts.load("10px CSP"), document.fonts.load("bold 10px CSP"), document.fonts.load("bold 20px CSP")]); } catch (e) {}
  st = load() || newFarm();
  spawnChickens();
  const cap = location.hash.match(/^#captura-([abcd])$/);
  if (cap) {
    demoState(cap[1]);
    for (let i = 0; i < 40; i++) update(0.05); // let the chickens settle
    if (cap[1] === "c") night.t = 2;
    frame(); document.title = "ready"; return;
  }
  requestAnimationFrame(loop);
})().catch(e => { ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = "#26381f"; ctx.fillRect(0, 0, W, H); text(String(e.message || e), 8, 8); });
</script>
